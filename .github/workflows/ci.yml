name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Before the tests, not after: the cli suite drives dist/cli.js when it
      # exists, which is both the artefact users run and plain javascript that
      # loads on every platform.
      - run: npm run build

      - run: npm test

      # The site renders its own examples through the built library, so a
      # template or a script that no longer matches the api fails here rather
      # than on the deploy.
      - run: npm run build:site

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The version bump comes from these messages, so a message that
      # release-please cannot read is a broken build, not a style nit. Same
      # script the commit-msg hook runs, so this cannot disagree with it.
      - name: check each commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE"..HEAD); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            git log -1 --format='%h %s' "$sha"
            scripts/check-commit-msg.sh "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

      # A squash merge takes its subject from the title, so on a squashing
      # repo the title is the message release-please ends up reading.
      - name: check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commit-msg.sh --subject "$TITLE"
