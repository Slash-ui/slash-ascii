name: release

# Every push to main is considered for a release. release-please reads the
# conventional commit messages since the last release, works out the semver
# bump, and opens a pull request that carries the new version and the
# changelog entries it derived. Nothing is tagged or published until someone
# merges that pull request: the merge is the approval.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release run at a time. Two in flight would race to open the same
# release pull request.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: propose or cut the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Pull requests opened with the default GITHUB_TOKEN do not start
          # other workflows, so the release pull request gets no ci run. If
          # main is protected by required status checks, swap this for a
          # personal access token with contents and pull-requests write, or
          # the release pull request will never be mergeable.
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish to npm
    needs: release
    # Only on the run where the release pull request was merged, which is
    # where release-please created the tag and the github release. Merging
    # that pull request is the approval, so a stable release goes from here
    # to npm without anyone clicking anything else.
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest

    # The environment scopes NPM_TOKEN to this one job and records every
    # publish as a deployment. It deliberately carries no required
    # reviewers: a gate here would let a release pull request merge, tag a
    # version and cut a github release that npm never received, which is a
    # worse state than either publishing or not.
    environment:
      name: npm
      url: https://www.npmjs.com/package/slash-ascii

    permissions:
      contents: read
      # Provenance ties the published tarball to this workflow and commit.
      # It is also what trusted publishing authenticates with, so this
      # permission covers both ways of getting into the registry.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, and trusted publishing wants 11.5.1 or newer.
      # Doing this now means swapping the token for OIDC later is a matter
      # of deleting the token, not of editing the runtime.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # The tag and the github release are already public by the time this
      # runs, so this is the last place a broken build can be stopped before
      # it reaches a version number that can never be reused.
      - run: npm test

      # Read the version from the tag being published rather than from an
      # action output, so an empty output cannot quietly hand a prerelease
      # the latest tag.
      - name: choose the dist-tag
        id: dist
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "$version -> $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Only a stable version takes latest. A prerelease goes out under next
      # so that npm install slash-ascii keeps meaning the stable release.
      - run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
