name: pages

# The site is rebuilt from the source it documents, so the examples on it are
# generated by the same code that ships. A release publishes a fresh copy
# carrying the new version number; a push to main keeps the prose current
# between releases.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# A queued run should replace a waiting one rather than deploy an older tree
# after a newer one, but never interrupt a deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site imports the built library to render its own examples, so the
      # build has to come first and a broken build fails here rather than
      # publishing a page with missing art.
      - run: npm run build

      - run: npm run build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
