<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A solid shape, which survives any coverage cutoff, and three two unit
       strokes, which do not: at 20 columns a cell spans 12 units, so a stroke
       covers about a sixth of every cell it crosses. The diagonal is the one a
       3x3 median erases, having fewer than five of its nine neighbours lit. -->
  <rect x="20" y="20" width="80" height="80" fill="#ffffff"/>
  <path d="M140 180H220" stroke="#ffffff" stroke-width="2"/>
  <path d="M180 140V220" stroke="#ffffff" stroke-width="2"/>
  <path d="M130 230L230 130" stroke="#ffffff" stroke-width="2"/>
</svg>
